name: 쿠팡 숏츠 완전 자동 (스레드 30분·인스타 3시간)

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 (붐비는 정각·30분을 피함) 같은 영상을 스레드·인스타에 함께
  workflow_dispatch:
    inputs:
      mode:
        description: "threads 또는 insta"
        required: true
        default: "threads"

permissions:
  contents: write
  actions: write
  issues: write
  pages: write
  id-token: write

concurrency:                 # 영상 공개 주소(Pages)를 같이 쓰는 작업과 겹치지 않게
  group: daily-reel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: 모드 정하기
        id: mode
        run: |
          M="${{ inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then M=threads; fi
          echo "mode=${M:-threads}" >> $GITHUB_OUTPUT; echo "모드: ${M:-threads}"

      - name: 도구 설치
        timeout-minutes: 6
        run: |
          pip install -q pillow numpy requests edge-tts imageio-ffmpeg
          # 영상 변환기: 패키지 서버를 거치지 않는 고정 실행파일
          if ! which ffmpeg >/dev/null; then
            F=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())"); sudo ln -sf "$F" /usr/local/bin/ffmpeg
          fi
          # 한글 글꼴: 깃허브에서 직접 받기
          mkdir -p ~/.fonts
          for w in Black Bold Medium; do
            [ -f ~/.fonts/NotoSansCJKkr-$w.otf ] || curl -sSL --retry 3 -o ~/.fonts/NotoSansCJKkr-$w.otf "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Korean/NotoSansCJKkr-$w.otf"
          done
          ffmpeg -version | head -1; ls -la ~/.fonts

      - name: 상품·대본·영상 준비
        id: prep
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python auto_coupang.py prepare ${{ steps.mode.outputs.mode }}

      - uses: actions/upload-pages-artifact@v3
        if: steps.prep.outputs.skip != 'true'
        with: { path: site }

      - name: 영상 공개 주소 만들기
        id: deploy
        if: steps.prep.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

      - name: 게시
        id: post
        if: steps.prep.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          set -o pipefail
          URL="${{ steps.deploy.outputs.page_url }}short-${{ steps.prep.outputs.name }}.mp4"
          for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w "%{http_code}" "$URL"); [ "$code" = "200" ] && break; sleep 10; done
          echo "영상 주소 $URL ($code)"
          # 실패하면 원인별로 기다렸다가 최대 3번 다시 올린다
          post() {  # $1=threads|insta : 실패하면 원인별로 기다렸다가 최대 3번
            for t in 1 2 3; do
              if [ "$1" = insta ]; then python post_instagram.py "$URL" "${{ steps.prep.outputs.insta_caption }}" 2>&1 | tee -a post.log && return 0
              else python post_threads.py "$URL" "${{ steps.prep.outputs.caption }}" 2>&1 | tee -a post.log && return 0; fi
              if grep -qiE "parse access token|expired|session has|OAuthException" post.log; then echo "TOKEN_ERROR $1" >> post.log; return 1; fi
              if grep -qiE "maximum number of posts|2207042" post.log; then return 1; fi
              sleep $((t * 60)); curl -s -o /dev/null "$URL"
            done; return 1; }
          OK=0
          post threads && echo "THREADS_OK" >> post.log && OK=1
          post insta && echo "INSTA_OK" >> post.log && OK=1
          [ $OK = 1 ]

      - name: 기록 저장
        if: always() && steps.prep.outputs.skip != 'true' && steps.prep.outcome == 'success'
        run: |
          N=${{ steps.prep.outputs.name }}
          grep -q THREADS_OK post.log && python auto_coupang.py mark threads $N "$(grep -o '게시물 ID: [0-9]*' post.log | head -1 | cut -c8-)"
          grep -q INSTA_OK post.log && python auto_coupang.py mark insta $N
          grep -q THREADS_OK post.log || python auto_coupang.py fail threads $N "$(grep -m1 '::error::' post.log)"
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add -A coupang naver-clip 2>/dev/null || git add -A coupang
          git commit -qm "쿠팡 자동 ${{ steps.mode.outputs.mode }}: ${{ steps.prep.outputs.name }} (${{ steps.post.outcome }})" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin main && break; sleep $((RANDOM % 6 + 5)); done

      - name: 토큰 만료면 알림 (깃허브 이슈)
        if: failure() && hashFiles('post.log') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q TOKEN_ERROR post.log || exit 0
          M="${{ steps.mode.outputs.mode }}"; T=$(grep -q "TOKEN_ERROR insta" post.log && echo IG_ACCESS_TOKEN || echo THREADS_ACCESS_TOKEN)
          gh issue list --state open --search "토큰 만료 $T" --json number -q '.[0].number' | grep -q . && exit 0
          gh issue create --title "⚠️ 토큰 만료: $T 다시 발급 필요" --body "쿠팡 자동 게시($M)가 토큰 오류로 멈췄습니다. Meta에서 토큰을 재발급해 Secrets의 $T 를 갱신하세요. 갱신 후 이 이슈를 닫으면 됩니다."
