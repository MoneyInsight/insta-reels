name: 토큰 점검 (게시 없음)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 인스타그램·스레드 토큰 확인
        env:
          IG: ${{ secrets.IG_ACCESS_TOKEN }}
          TH: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          curl -s "https://graph.instagram.com/v21.0/me?fields=username&access_token=$IG" | python3 -c "import json,sys;d=json.load(sys.stdin);print('인스타:', d.get('username') or d.get('error',{}).get('message'))"
          curl -s "https://graph.threads.net/v1.0/me?fields=username&access_token=$TH" | python3 -c "import json,sys;d=json.load(sys.stdin);print('스레드:', d.get('username') or d.get('error',{}).get('message'))"
      - uses: actions/checkout@v4
      - name: 쿠팡 클릭 리포트 확인
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q requests
          python auto_coupang.py gemtest
          python -c "
          import review, json, os
          js={'product':'테스트','scenes':[{'say':'테스트'}],'intro':{'say':''}}
          f=sorted(x for x in os.listdir('naver-clip') if x.endswith('.mp4'))[-1]
          print('AI 검수 테스트:', json.dumps(review.gemini_check(js,'', 'naver-clip/'+f), ensure_ascii=False)[:600])
          import requests; k=os.environ['GEMINI_API_KEY']
          r=requests.post(f'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key={k}',json={'contents':[{'parts':[{'text':'안녕하세요'}]}],'generationConfig':{'responseModalities':['AUDIO'],'speechConfig':{'voiceConfig':{'prebuiltVoiceConfig':{'voiceName':'Kore'}}}}}).json()
          print('TTS 테스트:', json.dumps(r.get('error','OK'), ensure_ascii=False)[:400])
          "
          if [ -n "$GEMINI_API_KEY" ]; then echo "Gemini 키: 있음"; else echo "Gemini 키: 없음"; fi
