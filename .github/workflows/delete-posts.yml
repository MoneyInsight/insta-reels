name: 게시물 삭제
on:
  workflow_dispatch:
    inputs:
      names: { description: "삭제할 NAME (공백 구분)", required: true }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          pip install -q requests
          python delete_posts.py ${{ inputs.names }}
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add coupang; git commit -qm "어색한 게시물 삭제 기록" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
