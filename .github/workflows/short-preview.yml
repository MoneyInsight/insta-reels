name: 숏츠 미리보기 (게시 없이 영상만)

on:
  push:
    branches: [main]
    paths: ["shorts/preview/*.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install -q pillow numpy requests edge-tts
      - name: 영상 만들기
        run: |
          mkdir -p preview-out
          for J in shorts/preview/*.json; do
            N=$(basename "$J" .json)
            python make_product_short.py "$J" "preview-out/$N.mp4"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: short-preview
          path: preview-out/*.mp4
          retention-days: 7
      - name: 미리보기 대본 정리
        run: |
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git rm -rq shorts/preview
          git commit -qm "숏츠 미리보기 완료" && git pull -q --rebase && git push -q
