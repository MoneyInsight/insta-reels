name: 카드뉴스 상품 찾기
on:
  workflow_dispatch:
    inputs:
      keyword: { description: "검색어", required: true }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          KW: ${{ inputs.keyword }}
        run: |
          pip install -q pillow requests
          python card_search.py "$KW"
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add coupang/cardnews; git commit -qm "카드뉴스 상품 검색: $KW" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
