name: 쿠팡 상세페이지 접근 시험
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.coupang.com/vp/products/9749612619 https://m.coupang.com/vm/products/9749612619; do
            c=$(curl -s -o /tmp/p.html -w "%{http_code}" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" -H "Accept-Language: ko-KR" "$u")
            echo "$c $(wc -c < /tmp/p.html) $(grep -o 'thumbnail[0-9]*.coupangcdn.com[^\" ]*' /tmp/p.html | wc -l) $u"
          done
