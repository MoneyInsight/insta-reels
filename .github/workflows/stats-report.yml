name: 구독자·조회수 현황
on:
  schedule: [{ cron: "17 13 * * *" }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          YTC_CLIENT_ID: ${{ secrets.YTC_CLIENT_ID }}
          YTC_CLIENT_SECRET: ${{ secrets.YTC_CLIENT_SECRET }}
          YTC_REFRESH_TOKEN: ${{ secrets.YTC_REFRESH_TOKEN }}
        run: |
          pip install -q requests
          python stats_report.py
          git config user.name "reel-bot"; git config user.email "reel-bot@users.noreply.github.com"
          git add coupang/followers_history.json coupang/stats_now.json; git commit -qm "구독자·조회수 현황" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin main && break; sleep 5; done
